# Stops pytest's search for config climbing up to the repo's own
# pyproject.toml, which is what happened before this file existed: these
# tests picked up vinzor's own `pythonpath = [".", "tests"]` and `-m "not
# live"` by accident, rootdir reported as the checkout root rather than
# mcp/, and "this lives outside vinzor's own test suite" was true in name
# only. An empty-looking file that changes where pytest stops looking is
# still doing real work.
[pytest]
testpaths = tests
