# The only thing listening on the outside of the Vinzor instance.
#
# The app itself stays bound to 127.0.0.1, which is the posture it documents
# for itself, and this forwards to it. Written whole rather than patched into
# the distribution's default, so there is exactly one default server and no
# argument about which one wins.
#
# Deployed by /usr/local/bin/vinzor-deploy, which runs `nginx -t` against it
# and puts the previous file back if it does not parse. It lives in the
# repository because a proxy that rewrites request headers is part of how the
# application behaves, not part of how a machine happens to be set up: the
# Secure flag on the session cookie is decided by a header this file sets.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # What protocol the *reader's browser* used, which is not what we are
    # speaking. TLS is terminated at the CDN in front, which reaches this
    # machine over plain HTTP, so `$scheme` here is always "http" and
    # forwarding it would tell the application that every request in the
    # world arrived in the clear. The application uses this to decide
    # whether the session cookie may be marked Secure, so getting it wrong
    # means the cookie is willing to travel unencrypted.
    #
    # Pass the incoming value through where there is one, and fall back to
    # our own scheme where there is not -- which is the direct, no-CDN case,
    # and is honestly "http".
    map $http_x_forwarded_proto $reader_protocol {
        default  $scheme;
        "~."     $http_x_forwarded_proto;
    }

    server {
        listen 80 default_server;
        server_name _;

        # The app accepts spreadsheets up to 20 MB; nginx must not refuse
        # first, or the officer gets nginx's error page instead of the
        # product's sentence explaining what was wrong with the file.
        client_max_body_size 25m;

        location / {
            proxy_pass http://127.0.0.1:8000;

            # Host must be the viewer's, not this machine's: the app
            # compares Origin against Host to reject cross-site writes, and
            # a rewritten Host would make every decision fail that check.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $reader_protocol;

            proxy_read_timeout 120s;
            proxy_buffering off;
        }
    }
}
